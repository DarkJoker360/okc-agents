[package]
name = "okc-agents"
version = "0.1.4"
authors = ["DDoSolitary <DDoSolitary@gmail.com>", "DarkJoker360 <simoespo159@gmail.com>"]
edition = "2018"

[dependencies]
base64 = "0.13.0"
clap = "2.33.3"
futures-util = "0.3.17"
lazy_static = "1.4.0"
libc = "0.2.103"
slog = "2.7.0"
slog-async = "2.7.0"
slog-envlogger = "2.2.0"
slog-term = "2.8.0"
tokio = { version = "1.12.0", features = ["full"] }
tokio-stream = { version = "0.1.7", features = ["net"] }
tokio-rustls = "0.24"
rustls = "0.21"
rustls-pemfile = "1.0"
sha2 = "0.10"
hex = "0.4"
rcgen = "0.11"
rand = "0.8"
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
lto = true
